# NewChainSafe — Stack PoC local
# Uso: `docker compose up -d`
# Requer `.env` na raiz (copiar de `.env.example` e ajustar).
# Vars de SSO Azure AD são configuradas em INF-05 (não obrigatórias para o compose subir).

name: newchainsafe

services:
  postgres:
    image: postgres:18.4
    container_name: newchainsafe-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vaultwarden}
      POSTGRES_USER: ${POSTGRES_USER:-vaultwarden}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD obrigatorio no .env}
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  vaultwarden:
    image: newchainsafe/vaultwarden:1.34.3-nc.1
    build:
      context: .
      dockerfile: docker/Dockerfile.debian
      args:
        DB: postgresql,enable_mimalloc
    container_name: newchainsafe-vaultwarden
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      maildev:
        condition: service_started
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-vaultwarden}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-vaultwarden}
      DOMAIN: ${DOMAIN:-http://localhost:8080}
      ROCKET_PORT: 8080
      SIGNUPS_ALLOWED: ${SIGNUPS_ALLOWED:-false}
      SMTP_HOST: maildev
      SMTP_PORT: 1025
      SMTP_SECURITY: "off"
      SMTP_FROM: ${SMTP_FROM:-vaultwarden@novacorrente.local}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-NewChainSafe}
      # SSO: vazio nesta etapa; INF-05 preenche.
      SSO_ONLY: "false"
    volumes:
      - vaultwarden_data:/data
    ports:
      - "${VAULTWARDEN_PORT:-8080}:8080"
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --tries=1
        - --spider
        - http://localhost:8080/alive
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  maildev:
    image: maildev/maildev:2.2.1
    container_name: newchainsafe-maildev
    restart: unless-stopped
    ports:
      - "${MAILDEV_UI_PORT:-1080}:1080"
      - "${MAILDEV_SMTP_PORT:-1025}:1025"

volumes:
  postgres_data:
    name: newchainsafe_postgres_data
  vaultwarden_data:
    name: newchainsafe_vaultwarden_data
